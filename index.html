<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SofftyLIVE Music HD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0c0c0c;
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* Sidebar */
        .sidebar {
            width: 240px;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            padding: 20px;
            border-right: 1px solid #222;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #1db954;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .sidebar-menu li a {
            color: #b3b3b3;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: 0.3s;
        }
        .sidebar-menu li a:hover {
            color: #ffffff;
        }
        /* Main Content */
        .main-content {
            flex: 1;
            background: linear-gradient(to bottom, #1f1f1f, #121212);
            overflow-y: auto;
            padding: 30px;
            padding-bottom: 120px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .usp-badge {
            background: #1db954;
            color: #000;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
        }
        .social-icons {
            display: flex;
            gap: 15px;
            font-size: 20px;
        }
        .social-icons a {
            color: #b3b3b3;
            transition: 0.3s;
        }
        .social-icons a:hover {
            color: #1db954;
        }
        /* Sections */
        .section-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
            margin-top: 25px;
        }
        .album-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }
        .album-card {
            background-color: #181818;
            padding: 15px;
            border-radius: 8px;
            transition: background-color 0.3s;
            cursor: pointer;
        }
        .album-card:hover {
            background-color: #282828;
        }
        .album-art {
            width: 100%;
            height: 150px;
            background-color: #333;
            border-radius: 6px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #777;
        }
        .album-name {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .album-desc {
            font-size: 12px;
            color: #b3b3b3;
        }
        /* Bottom Player */
        .player {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 90px;
            background-color: #181818;
            border-top: 1px solid #282828;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }
        .player-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .player-thumb {
            width: 50px;
            height: 50px;
            background: #333;
            border-radius: 4px;
        }
        .player-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .control-buttons {
            display: flex;
            gap: 20px;
            font-size: 18px;
            cursor: pointer;
        }
        .control-buttons i:hover {
            color: #1db954;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">
            <i class="fa-solid fa-music"></i> SofftyLIVE HD
        </div>
        <ul class="sidebar-menu">
            <li><a href="#"><i class="fa-solid fa-house"></i> Home</a></li>
            <li><a href="#"><i class="fa-solid fa-magnifying-glass"></i> Search</a></li>
            <li><a href="#"><i class="fa-solid fa-book"></i> Library</a></li>
        </ul>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
        <div class="header">
            <div class="usp-badge">100% Original HD Tracks, In-House Production</div>
            <div class="social-icons">
                <a href="#"><i class="fa-brands fa-youtube"></i></a>
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
                <a href="#"><i class="fa-brands fa-twitter"></i></a> <!-- Twitter logo added -->
            </div>
        </div>

        <div class="section-title">Music Albums & Categories</div>
        <div class="album-grid">
            <!-- 1. Tech -->
            <div class="album-card">
                <div class="album-art"><i class="fa-solid fa-microchip"></i></div>
                <div class="album-name">Tech Beats</div>
                <div class="album-desc">Category 1</div>
            </div>
            <!-- 2. Romantic -->
            <div class="album-card">
                <div class="album-art"><i class="fa-solid fa-heart"></i></div>
                <div class="album-name">Romantic Vibes</div>
                <div class="album-desc">Category 2</div>
            </div>
            <!-- 3. Breakup -->
            <div class="album-card">
                <div class="album-art"><i class="fa-solid fa-heart-crack"></i></div>
                <div class="album-name">Very Sad / Breakup</div>
                <div class="album-desc">Category 3</div>
            </div>
            <!-- 4. Shoot Out -->
            <div class="album-card">
                <div class="album-art"><i class="fa-solid fa-gun"></i></div>
                <div class="album-name">Shoot Out</div>
                <div class="album-desc">Category 4</div>
            </div>
            <!-- 5. Desi -->
            <div class="album-card">
                <div class="album-art"><i class="fa-solid fa-drum"></i></div>
                <div class="album-name">Desi Bawandar</div>
                <div class="album-desc">Category 5</div>
            </div>
        </div>
    </div>

    <!-- Fixed Bottom Player -->
    <div class="player">
        <div class="player-info">
            <div class="player-thumb"></div>
            <div>
                <div style="font-size: 14px; font-weight: bold;">Google ka Pyar</div>
                <div style="font-size: 12px; color: #b3b3b3;">SofftyLIVE Music HD</div>
            </div>
        </div>
        <div class="player-controls">
            <div class="control-buttons">
                <i class="fa-solid fa-backward-step"></i>
                <i class="fa-solid fa-circle-play" style="font-size: 24px; color: #1db954;"></i>
                <i class="fa-solid fa-forward-step"></i>
            </div>
        </div>
        <div style="width: 150px;"></div>
    </div>

</body>
</html>
