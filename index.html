<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SofftyLIVE Music HD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0c0c0c;
            color: #ffffff;
            overflow-x: hidden;
        }
        .app-container {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }
        .main-content {
            flex: 1;
            background: linear-gradient(to bottom, #1f1f1f, #121212);
            padding: 15px;
            padding-bottom: 120px;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .usp-badge {
            background: #1db954;
            color: #000000;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
        }
        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 15px;
        }
        .album-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
        }
        .album-card {
            background-color: #181818;
            padding: 10px;
            border-radius: 8px;
        }
        .album-art {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #252525;
            border-radius: 6px;
            margin-bottom: 8px;
            overflow: hidden;
            position: relative;
        }
        .album-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .album-name {
            font-size: 13px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .album-desc {
            font-size: 10px;
            color: #b3b3b3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .player {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background-color: #181818;
            border-top: 1px solid #282828;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 99999;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="main-content">
            <div class="header">
                <div class="usp-badge">SofftyLIVE Music HD - Live Now</div>
            </div>

            <div class="section-title">Music Categories</div>
            <div class="album-grid">
                <!-- 1. Official Launch -->
                <div class="album-card">
                    <div class="album-art">
                        <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500&auto=format&fit=crop&q=60" alt="Official Launch">
                    </div>
                    <div class="album-name">1. Official Launch</div>
                    <div class="album-desc">Sejla Singh Special</div>
                </div>

                <!-- 2. Romantic Vibes -->
                <div class="album-card">
                    <div class="album-art">
                        <img src="https://images.unsplash.com/photo-1518495973542-4542c06a5843?w=500&auto=format&fit=crop&q=60" alt="Romantic Vibes">
                    </div>
                    <div class="album-name">2. Romantic Vibes</div>
                    <div class="album-desc">Kannada Dhamaka</div>
                </div>

                <!-- 3. Very Sad / Breakup -->
                <div class="album-card">
                    <div class="album-art">
                        <img src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=500&auto=format&fit=crop&q=60" alt="Very Sad">
                    </div>
                    <div class="album-name">3. Very Sad / Breakup</div>
                    <div class="album-desc">Heartbroken Melodies</div>
                </div>

                <!-- 4. Desi Bawandar -->
                <div class="album-card">
                    <div class="album-art">
                        <img src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=500&auto=format&fit=crop&q=60" alt="Desi Bawandar">
                    </div>
                    <div class="album-name">4. Desi Bawandar</div>
                    <div class="album-desc">Golu Molu Group</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Player -->
    <div class="player">
        <div style="display: flex; align-items: center; gap: 10px;">
            <div style="width: 38px; height: 38px; background: #252525; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #1db954;"><i class="fa-solid fa-compact-disc"></i></div>
            <div>
                <div style="font-size: 12px; font-weight: bold; color: #fff;">Google ka Pyar</div>
                <div style="font-size: 10px; color: #b3b3b3;">SofftyLIVE</div>
            </div>
        </div>
        <div style="display: flex; gap: 15px; font-size: 18px; color: #fff;">
            <i class="fa-solid fa-backward-step"></i>
            <i class="fa-solid fa-circle-play" style="font-size: 22px; color: #1db954;"></i>
            <i class="fa-solid fa-forward-step"></i>
        </div>
    </div>

</body>
  </html>
