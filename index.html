<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Soffty Live Music HD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            padding: 12px;
            padding-bottom: 90px;
        }
        .header {
            text-align: center;
            padding: 15px 0;
            border-bottom: 1px solid #1f1f1f;
            margin-bottom: 15px;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 800;
            color: #1db954;
        }
        .section-title {
            font-size: 14px;
            font-weight: 700;
            margin: 15px 0 10px 0;
            color: #e0e0e0;
        }
        /* 5 Categories Grid */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .cat-card {
            background: #181818;
            border-radius: 8px;
            padding: 8px;
            border: 1px solid #222;
        }
        .cat-img {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 6px;
            overflow: hidden;
            background: #202020;
        }
        .cat-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .cat-name {
            font-size: 11px;
            font-weight: 600;
            margin-top: 6px;
            text-align: center;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* YouTube Single Window */
        .youtube-box {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            border: 1px solid #222;
            margin-bottom: 20px;
        }
        .youtube-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        /* Fixed Bottom Player */
        .player {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background-color: #121212;
            border-top: 1px solid #282828;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 9999;
        }
        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .player-title {
            font-size: 12px;
            font-weight: 700;
            color: #fff;
        }
        .player-sub {
            font-size: 10px;
            color: #888;
        }
        .player-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 18px;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- 1. Header Name -->
    <div class="header">
        <h1>Soffty Live Music HD</h1>
    </div>

    <!-- 2. 5 Categories of Songs -->
    <div class="section-title"><i class="fa-solid fa-list-music"></i> Song Categories (5)</div>
    <div class="category-grid">
        <div class="cat-card">
            <div class="cat-img">
                <img src="https://i.postimg.cc/VS971P77/853520220-1386578443466073-7456660932332718580-n-webp.jpg" alt="Official">
            </div>
            <div class="cat-name">1. Official Launch</div>
        </div>

        <div class="cat-card">
            <div class="cat-img">
                <img src="https://i.postimg.cc/cK7DZGD9/859943092-1607281881413505-7529994336343854403-n-webp.jpg" alt="Romantic">
            </div>
            <div class="cat-name">2. Romantic Hits</div>
        </div>

        <div class="cat-card">
            <div class="cat-img">
                <img src="https://i.postimg.cc/PLb6hn6K/Meta-AI-870248943-29455266050744839-8959811191056219686-n-20261031-060734-webp.jpg" alt="Sad">
            </div>
            <div class="cat-name">3. Sad / Breakup</div>
        </div>

        <div class="cat-card">
            <div class="cat-img">
                <img src="https://i.postimg.cc/R31P9xPL/Meta-AI-877586257-1653538243169385-1567739952289461802-n-20261101-201320-webp.jpg" alt="Desi">
            </div>
            <div class="cat-name">4. Desi Bawandar</div>
        </div>

        <div class="cat-card" style="grid-column: span 2;">
            <div class="cat-img" style="aspect-ratio: 16 / 5;">
                <img src="https://i.postimg.cc/VS971P77/853520220-1386578443466073-7456660932332718580-n-webp.jpg" alt="Special">
            </div>
            <div class="cat-name">5. Special Bhojpuri Mix</div>
        </div>
    </div>

    <!-- 3. Single YouTube Reel Window -->
    <div class="section-title"><i class="fa-brands fa-youtube" style="color: #ff0000;"></i> YouTube Reel Feed</div>
    <div class="youtube-box">
        <iframe src="https://www.youtube.com/embed/VZhAQ961zTA" title="YouTube video player" allowfullscreen></iframe>
    </div>

    <!-- 4. Niche Bottom Player -->
    <div class="player">
        <div class="player-info">
            <div style="width: 35px; height: 35px; background: #202020; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #1db954;"><i class="fa-solid fa-music"></i></div>
            <div>
                <div class="player-title">Har Khwab Cheekh Raha Hai</div>
                <div class="player-sub">Soffty Live Music</div>
            </div>
        </div>
        <div class="player-controls">
            <i class="fa-solid fa-backward-step"></i>
            <i class="fa-solid fa-circle-play" style="font-size: 22px; color: #1db954;"></i>
            <i class="fa-solid fa-forward-step"></i>
        </div>
    </div>

</body>
</html>
